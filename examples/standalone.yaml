# yaml-language-server: $schema=../charts/openbao/values.schema.json
#
# Example: standalone mode (single replica, integrated Raft storage, TLS via cert-manager)
# =======================================================================================
#
# Standalone runs ONE OpenBao node on integrated storage (Raft consensus). The
# node is a 1-of-1 Raft cluster: it is always the leader once unsealed. You get
# the same storage engine as examples/ha-raft.yaml, so you can:
#   * take online snapshots (`bao operator raft snapshot save`) and use the
#     snapshot agent (examples/overlays/snapshot-s3.yaml);
#   * scale out to a 3-node HA Raft cluster later without a data migration
#     (docs/chart/09-deployment-modes.md, "Standalone -> HA Raft").
# It is still NOT highly available: a pod restart means downtime.
#
# Use for: small internal installations that accept downtime during restarts.
# For production with availability requirements, use examples/ha-raft.yaml.
#
# Prerequisites:
#   * cert-manager installed (the chart creates a Certificate and, here, a
#     self-signed Issuer). Without cert-manager, `helm install` fails with
#     `no matches for kind "Certificate"`.
#   * a default StorageClass, or set server.dataStorage.storageClass. Raft
#     calls fsync on every write: prefer SSD-backed storage.
#
# Install:
#   helm upgrade --install openbao ./charts/openbao \
#     -n openbao --create-namespace -f examples/standalone.yaml
#
# First start. The server starts UNINITIALIZED and SEALED; the pod stays
# Running 0/1 until it is unsealed:
#   examples/scripts/init-unseal.sh -n openbao -r openbao
# or by hand:
#   kubectl -n openbao exec openbao-0 -- bao operator init -key-shares=5 -key-threshold=3
#   kubectl -n openbao exec openbao-0 -- bao operator unseal   # repeat 3 times
#
# Check the single-node Raft cluster (after `bao login`):
#   kubectl -n openbao exec openbao-0 -- bao operator raft list-peers
#   # Node         Address                          State     Voter
#   # openbao-0    openbao-0.openbao-internal:8201  leader    true
#   kubectl -n openbao exec openbao-0 -- bao operator raft autopilot state
#
# Online backup / restore:
#   kubectl -n openbao exec openbao-0 -- bao operator raft snapshot save /tmp/bao.snap
#   kubectl -n openbao cp openbao-0:/tmp/bao.snap ./bao-$(date +%F).snap
#
# After every pod restart the server is sealed again unless you add a seal
# stanza (auto-unseal). See docs/chart/12-advanced.md#2-auto-unseal.
#
# Enable the audit device once, after unseal and login:
#   kubectl -n openbao exec openbao-0 -- bao audit enable file file_path=/openbao/audit/audit.log
#
# Upgrading a release whose standalone mode still used the `file` backend:
# the pod refuses to start until the data is migrated, see
# docs/chart/09-deployment-modes.md, "Migrating a file-backed standalone to Raft".
#
# Docs: docs/chart/09-deployment-modes.md#3-standalone-mode

global:
  # Turn TLS on. The server.tls.* block below only takes effect when this is
  # false. The chart fails to render if TLS material is set while this is true.
  tlsDisable: false

server:
  dev_mode:
    enabled: false        # no auto-init/auto-unseal, no keys on disk

  standalone:
    enabled: true
    # The default server.standalone.config is used: TLS listener (when
    # global.tlsDisable is false) and `storage "raft" { path = <dataStorage.mountPath> }`.
    # If you override it, copy the default from charts/openbao/values.yaml,
    # keep the `{{- if .Values.global.tlsDisable }}` block and the raft
    # storage block, and do not add retry_join or service_registration.

  tls:
    source: certManager
    tlsMinVersion: tls12
    certManager:
      # The chart creates a self-signed Issuer `<fullname>-issuer`.
      # For production prefer a corporate CA: set clusterIssuerName instead
      # (it takes precedence over generateIssuer).
      generateIssuer: true
      # clusterIssuerName: corp-ca
      duration: 8760h       # 1 year
      renewBefore: 720h     # renew 30 days before expiry
      # Add the external host name if you expose OpenBao with TLS passthrough.
      extraSans: []
      # - openbao.example.com

  dataStorage:
    size: 10Gi
    # The default standalone config uses this path as the Raft `path`.
    mountPath: /openbao/data
    # storageClass: premium-ssd

  # Opt-in volume for the file audit device (enabled inside OpenBao later).
  auditStorage:
    enabled: true
    size: 5Gi

  # Keep data when the release is uninstalled or the StatefulSet is deleted.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

  # Guaranteed QoS: requests equal limits.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 256Mi

  logLevel: info
  logFormat: json

  # Give OpenBao time to shut down cleanly: preStop sleeps, then sends SIGTERM.
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 30

  # Adds a checksum of the rendered config to the pod, so you can see which
  # pods still run an old config (updateStrategyType stays OnDelete).
  configAnnotation: true

  # Pod Security "restricted" compatible container settings. A non-empty
  # value replaces the chart defaults completely.
  statefulSet:
    securityContext:
      container:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]

ui:
  # Creates the extra Service `openbao-ui` (ClusterIP). The UI itself is
  # always served on the API port.
  enabled: true
  serviceType: ClusterIP
